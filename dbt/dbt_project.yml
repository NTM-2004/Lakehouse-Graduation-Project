# ===========================================================================
# dbt_project.yml - Khai báo cấu hình dự án dbt E-commerce Lakehouse (B-012)
# ===========================================================================

name: 'lakehouse'
version: '1.0.0'
config-version: 2

profile: 'lakehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Tham số dùng chung toàn dự án (Requirement v3, Design Bronze/Silver v2, Design Gold v2)
vars:
  # Ngày chốt dữ liệu (Cutoff date): việc sau ngày này coi như chưa xảy ra
  cutoff_date: '2018-08-31'
  cutoff_timestamp: '2018-08-31 23:59:59.999999'

  # Ngưỡng cờ mẫu nhỏ (is_small_sample)
  small_sample_orders: 100    # Tháng có dưới 100 đơn hợp lệ
  small_sample_group: 30      # Nhóm có dưới 30 quan sát

  # Batch hiện tại (mặc định là batch cuối 2018-08 khi chạy tổng hợp)
  batch_id: '2018-08'
  final_batch_id: '2018-08'

# Khai báo cách vật hóa mặc định cho từng tầng dữ liệu
models:
  lakehouse:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

seeds:
  lakehouse:
    +schema: silver
    batch_seq:
      +column_types:
        batch_id: varchar
        batch_seq: integer
    flag_catalog:
      +column_types:
        flag_id: varchar
        table_name: varchar
        condition: varchar
        an_id: varchar
        kpi_impact: varchar
    orphan_expected:
      +column_types:
        relation: varchar
        parent_table: varchar
        child_table: varchar
        bulk_2016_09_2018_05: integer
        batch_2018_06: integer
        batch_2018_07: integer
        batch_2018_08: integer
    an_expected:
      +column_types:
        an_id: varchar
        sub_code: varchar
        table_name: varchar
        description: varchar
        expected_count: integer
