# ===========================================================================
# profiles.yml - Kết nối dbt tới Dremio qua dbt-dremio adapter (B-013)
# ===========================================================================

lakehouse:
  target: dev
  outputs:
    dev:
      type: dremio
      software_host: "{{ env_var('DREMIO_HOST', 'localhost') }}"
      port: "{{ env_var('DREMIO_PORT', '9047') | int }}"
      user: "{{ env_var('DREMIO_ADMIN_USER', 'admin') }}"
      password: "{{ env_var('DREMIO_ADMIN_PASSWORD', 'admin12345') }}"
      use_ssl: false
      datalake: hive             # Tên nguồn Hive Metastore đăng ký trên Dremio
      database: hive
      schema: silver             # Schema mặc định
