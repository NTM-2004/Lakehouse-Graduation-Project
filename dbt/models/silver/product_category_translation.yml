# dbt/models/silver/product_category_translation.yml - Kiểm thử cho B-301
# Tác giả phụ trách: Kiên | Reviewer: Minh | Mẫu: M-03
# ===========================================================================

version: 2

models:
  - name: product_category_translation
    description: >
      Bảng Silver bản dịch danh mục sản phẩm tiếng Bồ Đào Nha sang tiếng Anh (B-301).
      Grain: 1 dòng = 1 product_category_name. Không có cột dq_flag; không tự bổ sung bản dịch thiếu.
    tests:
      - translation_an10_missing_categories:
          config:
            severity: warn
    columns:
      - name: product_category_name
        description: "Khóa chính tên danh mục tiếng Bồ Đào Nha (đã bỏ BOM ở tầng Bronze)."
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: product_category_name_english
        description: "Tên danh mục sản phẩm tiếng Anh."
        tests:
          - not_null:
              config:
                severity: error

      - name: source_file
        description: "Tên tệp CSV nguồn (F17)."
        tests:
          - not_null:
              config:
                severity: error

      - name: batch_id
        description: "Tên batch nạp của dòng được giữ (F17)."
        tests:
          - not_null:
              config:
                severity: error

  - name: product_category_translation_rejects
    description: >
      Bảng reject mức 1 của silver.product_category_translation (B-301):
      lưu các dòng thiếu khóa chính product_category_name.
    tests:
      - reject_count_zero:
          config:
            severity: warn
    columns:
      - name: reject_reason
        description: "Lý do đẩy vào bảng reject mức 1."
        tests:
          - not_null:
              config:
                severity: error
