# ===========================================================================
# dbt/models/silver/order_items.yml - Kiểm thử cho silver.order_items (B-311)
# Tác giả phụ trách: Kiên | Reviewer: Minh | Mẫu: M-03
# ===========================================================================

version: 2

models:
  - name: order_items
    description: >
      Bảng Silver dòng hàng Olist (B-311).
      Grain: 1 dòng = 1 cặp (order_id, order_item_id).
      Lọc mức 1 dòng price <= 0 hoặc thiếu khóa; gắn cờ I1 (> 148 ngày lịch), T1
      và lưu truy vết source_file, batch_id (F17).
    tests:
      - composite_key_unique:
          columns: ['order_id', 'order_item_id']
          config:
            severity: error
      - order_items_positive_price_non_neg_freight:
          config:
            severity: error
      - order_items_sequential_item_id:
          config:
            severity: error
      - order_items_an05_expected_counts:
          config:
            severity: warn
      - silver_no_t1_cast_failures:
          config:
            severity: warn
    columns:
      - name: order_id
        description: "Mã đơn hàng (một phần khóa ghép; FK cứng sang silver.orders)."
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: ref('orders')
              field: order_id
              config:
                severity: error

      - name: order_item_id
        description: "Số thứ tự dòng hàng trong đơn, liên tục từ 1."
        tests:
          - not_null:
              config:
                severity: error

      - name: product_id
        description: "Mã sản phẩm (FK cứng sang silver.products)."
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: ref('products')
              field: product_id
              config:
                severity: error

      - name: seller_id
        description: "Mã người bán (FK cứng sang silver.sellers)."
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: ref('sellers')
              field: seller_id
              config:
                severity: error

      - name: shipping_limit_date
        description: "Hạn bàn giao hãng vận chuyển (mốc kế hoạch, giữ nguyên kể cả năm 2020)."
        tests:
          - not_null:
              config:
                where: "dq_flag IS NULL OR (',' || dq_flag || ',') NOT LIKE '%,T1:shipping_limit_date,%'"
                severity: error

      - name: price
        description: "Giá dòng hàng DECIMAL(10,2), bắt buộc > 0."
        tests:
          - not_null:
              config:
                severity: error

      - name: freight_value
        description: "Cước vận chuyển DECIMAL(10,2), không âm."
        tests:
          - not_null:
              config:
                where: "dq_flag IS NULL OR (',' || dq_flag || ',') NOT LIKE '%,T1:freight_value,%'"
                severity: error

      - name: dq_flag
        description: "Cờ chất lượng dữ liệu (I1, T1:<cột>); NULL là sạch."

      - name: source_file
        description: "Tên tệp CSV nguồn (F17)."
        tests:
          - not_null:
              config:
                severity: error

      - name: batch_id
        description: "Tên batch nạp của dòng được giữ (F17)."
        tests:
          - not_null:
              config:
                severity: error

  - name: order_items_rejects
    description: >
      Bảng reject mức 1 của silver.order_items (B-311): lưu các dòng thiếu/hỏng
      order_id, order_item_id hoặc price (gồm price <= 0).
    tests:
      - reject_count_zero:
          config:
            severity: warn
    columns:
      - name: reject_reason
        description: "Lý do đẩy vào bảng reject mức 1."
        tests:
          - not_null:
              config:
                severity: error
