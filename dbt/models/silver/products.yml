# ===========================================================================
# dbt/models/silver/products.yml - Kiểm thử cho silver.products (B-307)
# Tác giả phụ trách: Kiên | Reviewer: Minh | Mẫu: M-03
# ===========================================================================

version: 2

models:
  - name: products
    description: >
      Bảng Silver sản phẩm Olist (B-307).
      Grain: 1 dòng = 1 product_id. Đã sửa lỗi chính tả 'lenght' -> 'length', nối bản dịch danh mục,
      đổi product_weight_g = 0 thành NULL, gắn cờ PR1–PR3, T1 và lưu truy vết source_file, batch_id (F17).
    tests:
      - products_numeric_non_negative:
          config:
            severity: error
      - products_an10_expected_counts:
          config:
            severity: warn
      - translation_an10_missing_categories:
          config:
            severity: warn
      - silver_no_t1_cast_failures:
          config:
            severity: warn
    columns:
      - name: product_id
        description: "Khóa chính sản phẩm."
        tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: product_category_name
        description: "Tên danh mục tiếng Bồ Đào Nha ('unknown' nếu thiếu, gắn cờ PR1)."
        tests:
          - not_null:
              config:
                severity: error

      - name: product_category_en
        description: "Tên danh mục tiếng Anh ('unknown' nếu thiếu danh mục; tên gốc nếu thiếu bản dịch)."
        tests:
          - not_null:
              config:
                severity: error

      - name: product_name_length
        description: "Độ dài tên sản phẩm (đã sửa tên từ product_name_lenght)."

      - name: product_description_length
        description: "Độ dài mô tả sản phẩm (đã sửa tên từ product_description_lenght)."

      - name: product_photos_qty
        description: "Số lượng ảnh sản phẩm."

      - name: product_weight_g
        description: "Cân nặng sản phẩm theo gram (giá trị 0 chuyển thành NULL kèm cờ PR2)."

      - name: product_length_cm
        description: "Chiều dài sản phẩm theo cm."

      - name: product_height_cm
        description: "Chiều cao sản phẩm theo cm."

      - name: product_width_cm
        description: "Chiều rộng sản phẩm theo cm."

      - name: dq_flag
        description: "Cờ chất lượng dữ liệu (PR1, PR2, PR3, T1:<cột>); NULL là sạch."

      - name: source_file
        description: "Tên tệp CSV nguồn (F17)."
        tests:
          - not_null:
              config:
                severity: error

      - name: batch_id
        description: "Tên batch nạp của dòng được giữ (F17)."
        tests:
          - not_null:
              config:
                severity: error

  - name: products_rejects
    description: >
      Bảng reject mức 1 của silver.products (B-307): lưu các dòng thiếu khóa chính product_id.
      Giữ nguyên các cột Bronze và bổ sung cột reject_reason.
    tests:
      - reject_count_zero:
          config:
            severity: warn
    columns:
      - name: reject_reason
        description: "Lý do đẩy vào bảng reject mức 1."
        tests:
          - not_null:
              config:
                severity: error
