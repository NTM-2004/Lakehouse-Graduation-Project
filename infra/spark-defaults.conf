# B-010: spark-defaults.conf
# Cấu hình Spark: catalog Iceberg qua Hive Metastore, đọc ghi MinIO qua s3a://

spark.sql.extensions               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog           hive

# Catalog Hive / Iceberg
spark.sql.catalog.hive             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.hive.type        hive
spark.sql.catalog.hive.uri         thrift://hive-metastore:9083
spark.sql.catalog.hive.warehouse   s3a://lakehouse/
spark.sql.catalog.hive.io-impl     org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.hive.s3.endpoint http://minio:9000
spark.sql.catalog.hive.s3.path-style-access true

# Trần bộ nhớ ứng dụng thấp hơn trần container spark (2048M) theo Design Deployment
spark.driver.memory                1g

# Hadoop S3A settings for MinIO (khóa đọc từ biến môi trường AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
